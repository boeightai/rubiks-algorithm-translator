<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://va.vercel-scripts.com https://vitals.vercel-insights.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <!-- Cache control meta tags - less aggressive to allow image caching -->
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Bo and Hailey's Rubik's Cube Algorithm Translator</title>
    <meta name="description" content="Learn and practice Rubik's Cube algorithms with visual notation translation. Convert algorithm notation to step-by-step visual move sequences." />
    <meta name="keywords" content="rubik's cube, algorithms, speedcubing, notation, visual, tutorial" />
    <meta name="author" content="Bo Nam" />
    <!-- Kept in sync with the service worker cache version by update-sw-version.js -->
    <meta name="build-version" content="v20" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cube Translator" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <!-- Open Graph / Facebook -->
    <!-- Card images must be an absolute URL and a raster format. Social crawlers
         do not resolve relative paths and do not render SVG, so either one on its
         own leaves the link preview blank. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Way of the Cube" />
    <meta property="og:title" content="Way of the Cube — Rubik's Cube algorithms turned into pictures" />
    <meta property="og:description" content="Learn and practice Rubik's Cube algorithms with visual notation translation. Every move becomes a picture anyone can follow." />
    <meta property="og:url" content="https://www.wayofthecube.com" />
    <meta property="og:image" content="https://www.wayofthecube.com/images/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Way of the Cube: the cube mascot beside the R U R' U' moves drawn as arrow diagrams" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Way of the Cube — Rubik's Cube algorithms turned into pictures" />
    <meta name="twitter:description" content="Learn and practice Rubik's Cube algorithms with visual notation translation. Every move becomes a picture anyone can follow." />
    <meta name="twitter:image" content="https://www.wayofthecube.com/images/og-image.png" />
    <meta name="twitter:image:alt" content="Way of the Cube: the cube mascot beside the R U R' U' moves drawn as arrow diagrams" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
